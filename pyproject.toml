[project]
name = "aoe2-ai-parser"
version = "0.1.0"
description = "Parser, linter, package validator, and editor tooling for Age of Empires II DE AI scripting"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aoe2-ai-parser = "aoe2_ai_lab.cli:main"
aoe2-ai-lab = "aoe2_ai_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

